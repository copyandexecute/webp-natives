name: build

# Builds the per-platform JNI natives on the matching host OS. Each
# platform module is gated by an `onlyIf isWindows/isLinux/isMac` check
# in its own build.gradle.kts, so `./gradlew build` on a given runner
# only triggers the native build relevant to that host — no manual
# matrix-task selection needed.
#
# Native artifacts are uploaded per job so a publish workflow (or a
# release release) can pick them all up without re-running.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  build-native: one job per (OS, arch) — produces the matching DLL/
  #  .so/.dylib, runs the smoke-test against it, uploads as an artifact.
  # ─────────────────────────────────────────────────────────────────
  build-native:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    env:
      # libvpx (the VP9/WebM dep) is built via the runner's preinstalled
      # vcpkg in manifest mode. Cache built packages in the GitHub Actions
      # cache so it's compiled once per (OS, arch) instead of every run.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,   label: "windows / x64",    module: webp-natives-windows, artifact: native-windows-x64,     resource-glob: "webp-natives-windows/build/resources/main/native/**" }
          - { runner: windows-11-arm,   label: "windows / arm64",  module: webp-natives-windows, artifact: native-windows-arm64,   resource-glob: "webp-natives-windows/build/resources/main/native/**" }
          - { runner: ubuntu-latest,    label: "linux / x64",      module: webp-natives-linux,   artifact: native-linux-x64,       resource-glob: "webp-natives-linux/build/resources/main/native/**" }
          - { runner: ubuntu-24.04-arm, label: "linux / arm64",    module: webp-natives-linux,   artifact: native-linux-arm64,     resource-glob: "webp-natives-linux/build/resources/main/native/**" }
          # macos-latest is currently arm64. The dylib is a universal
          # binary (x86_64 + arm64 fat file) — Mac x64 hosts also get
          # the same artifact.
          # macOS: both archs built on macos-14 (Apple Silicon, Xcode 15).
          # Universal binary breaks libwebp's SSE2 per-file flags, but two
          # separate single-arch builds work fine — Apple Clang on the arm64
          # host cross-compiles x86_64 via -DCMAKE_OSX_ARCHITECTURES=x86_64.
          # Beats the alternative of waiting 30+ min in the rare macos-13
          # Intel runner queue.
          - { runner: macos-14,         label: "macos / x64",       module: webp-natives-macos,  artifact: native-macos-x64,       resource-glob: "webp-natives-macos/build/resources/main/native/**" }
          - { runner: macos-14,         label: "macos / arm64",     module: webp-natives-macos,  artifact: native-macos-arm64,     resource-glob: "webp-natives-macos/build/resources/main/native/**" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Expose the GitHub Actions cache endpoint to vcpkg's x-gha binary
      # source so libvpx packages persist across runs. (vcpkg reads these
      # two env vars; they aren't propagated to job env automatically.)
      - name: Enable vcpkg GitHub Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # libvpx's x86/x64 SIMD needs the NASM assembler. vcpkg auto-acquires it
      # on Windows, but on Linux/macOS its libvpx port wants NASM from the
      # system package manager. (arm64 builds use the GNU assembler and don't
      # need it, but installing is harmless.)
      - name: Install NASM (libvpx dependency)
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y nasm; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install nasm; fi
        shell: bash

      # processResources triggers the platform's CMake task chain via the
      # dependsOn(copyXxx) wiring in each module's build.gradle.kts. On
      # macOS we have two jobs on the same arm64 runner — one builds the
      # arm64 dylib via the default processResources host-arch detection,
      # the other cross-compiles x86_64 by calling the per-arch task
      # directly.
      - name: Build native for ${{ matrix.module }} (default host arch)
        if: ${{ !contains(matrix.label, 'macos / x64') }}
        run: ./gradlew :${{ matrix.module }}:processResources --no-daemon
        shell: bash

      - name: Build native for macos / x64 (cross-compile from arm64 host)
        if: ${{ contains(matrix.label, 'macos / x64') }}
        run: ./gradlew :webp-natives-macos:copyMacosDylibX64 --no-daemon
        shell: bash

      # Smoke-test loads the freshly-built native via mavenLocal +
      # NativeLoader — a true end-to-end correctness check on this host.
      # Skipped for the macos/x64 cross-compile job: the binary was built
      # for x86_64 but the runner is arm64, so System.load would fail.
      - name: Smoke-test
        if: ${{ !contains(matrix.label, 'macos / x64') }}
        run: ./gradlew :smoke-test:run --no-daemon
        shell: bash

      # VP9/WebM end-to-end (encode → .webm → streaming decode → fidelity).
      # Skipped on the macos/x64 cross job for the same reason as the WebP
      # smoke-test: the binary targets x86_64 but the runner is arm64.
      - name: WebM smoke-test
        if: ${{ !contains(matrix.label, 'macos / x64') }}
        run: ./gradlew :smoke-test:runWebm --no-daemon
        shell: bash

      - name: Verify native artifact exists
        run: |
          ls -la $(find ${{ matrix.module }}/build/resources/main/native -type f) || \
            (echo "No native artifact produced for ${{ matrix.module }}" && exit 1)
        shell: bash

      - name: Upload native
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.resource-glob }}
          if-no-files-found: error
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  #  collect: pulls every per-platform artifact into one bundle so a
  #  publish workflow can grab a single download.
  # ─────────────────────────────────────────────────────────────────
  collect:
    name: collect all natives
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: false

      - name: List collected natives
        run: find natives -type f | sort

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: natives-all
          path: natives
          retention-days: 30
