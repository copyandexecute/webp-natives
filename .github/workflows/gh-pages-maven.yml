name: Publish to GitHub Pages Maven

# Builds the per-platform JNI natives on real hosts, stages them into
# src/main/resources/ on a Linux runner, then publishes every module to
# mavenLocal and rsyncs the result onto the gh-pages branch — which is
# served as a public, no-auth Maven repository under
#   https://<owner>.github.io/<repo>/
#
# `keep_files: true` on the gh-pages deploy means old version artifacts
# accumulate; only maven-metadata.xml gets overwritten each run (so the
# "latest" lookup reflects the most recent publish, while pinned versions
# remain resolvable forever).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: "gh-pages-maven-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  Build native DLLs (windows x64 + arm64) via CMake + MSVC
  # ─────────────────────────────────────────────────────────────────
  natives-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Windows x64 DLL
        shell: bash
        run: ./gradlew :webp-natives-windows:copyWindowsDllX64 --no-daemon

      - name: Upload Windows x64 native
        uses: actions/upload-artifact@v4
        with:
          name: natives-windows-x64
          path: webp-natives-windows/build/resources/main/native/windows/x64/
          if-no-files-found: error

  natives-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Windows arm64 DLL
        shell: bash
        run: ./gradlew :webp-natives-windows:copyWindowsDllArm64 --no-daemon

      - name: Upload Windows arm64 native
        uses: actions/upload-artifact@v4
        with:
          name: natives-windows-arm64
          path: webp-natives-windows/build/resources/main/native/windows/arm64/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  #  Build Linux .so (x64 + aarch64) via CMake + gcc
  # ─────────────────────────────────────────────────────────────────
  natives-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NASM (libvpx dependency)
        run: sudo apt-get update && sudo apt-get install -y nasm
        shell: bash

      - name: Build Linux x64 .so
        run: ./gradlew :webp-natives-linux:copyLinuxSoX64 --no-daemon

      - name: Upload Linux x64 native
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux-x64
          path: webp-natives-linux/build/resources/main/native/linux/x64/
          if-no-files-found: error

  natives-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NASM (libvpx dependency)
        run: sudo apt-get update && sudo apt-get install -y nasm
        shell: bash

      - name: Build Linux arm64 .so
        run: ./gradlew :webp-natives-linux:copyLinuxSoArm64 --no-daemon

      - name: Upload Linux arm64 native
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux-arm64
          path: webp-natives-linux/build/resources/main/native/linux/arm64/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  #  Build macOS dylib (universal x86_64 + arm64) via CMake + clang
  # ─────────────────────────────────────────────────────────────────
  natives-macos-x64:
    # Apple Silicon runner cross-compiling x86_64 via
    # -DCMAKE_OSX_ARCHITECTURES=x86_64. Universal builds break libwebp's
    # SSE2 per-file flags, but two separate single-arch builds work
    # fine — and using macos-14 for both avoids the painfully long
    # macos-13 (Intel) runner queue.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NASM (libvpx dependency)
        run: brew install nasm
        shell: bash

      - name: Build macOS x86_64 dylib
        run: ./gradlew :webp-natives-macos:copyMacosDylibX64 --no-daemon

      - name: Upload macOS x64 native
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos-x64
          path: webp-natives-macos/build/resources/main/native/macos/x64/
          if-no-files-found: error

  natives-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NASM (libvpx dependency)
        run: brew install nasm
        shell: bash

      - name: Build macOS arm64 dylib
        run: ./gradlew :webp-natives-macos:copyMacosDylibArm64 --no-daemon

      - name: Upload macOS arm64 native
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos-arm64
          path: webp-natives-macos/build/resources/main/native/macos/arm64/
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  #  Assemble + publish
  # ─────────────────────────────────────────────────────────────────
  publish:
    needs: [natives-windows-x64, natives-windows-arm64, natives-linux-x64, natives-linux-arm64, natives-macos-x64, natives-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Stage prebuilt natives into src/main/resources so each module's
      # processResources picks them up on the ubuntu publish host.
      # (The platform Copy tasks themselves are isWindows/isLinux/isMac
      # gated and become no-ops here.)
      - name: Download Windows x64 native
        uses: actions/download-artifact@v4
        with:
          name: natives-windows-x64
          path: webp-natives-windows/src/main/resources/native/windows/x64/

      - name: Download Windows arm64 native
        uses: actions/download-artifact@v4
        with:
          name: natives-windows-arm64
          path: webp-natives-windows/src/main/resources/native/windows/arm64/

      - name: Download Linux x64 native
        uses: actions/download-artifact@v4
        with:
          name: natives-linux-x64
          path: webp-natives-linux/src/main/resources/native/linux/x64/

      - name: Download Linux arm64 native
        uses: actions/download-artifact@v4
        with:
          name: natives-linux-arm64
          path: webp-natives-linux/src/main/resources/native/linux/arm64/

      - name: Download macOS x64 native
        uses: actions/download-artifact@v4
        with:
          name: natives-macos-x64
          path: webp-natives-macos/src/main/resources/native/macos/x64/

      - name: Download macOS arm64 native
        uses: actions/download-artifact@v4
        with:
          name: natives-macos-arm64
          path: webp-natives-macos/src/main/resources/native/macos/arm64/

      - name: Show staged natives
        run: |
          echo "--- Windows ---"; find webp-natives-windows/src/main/resources/native -type f 2>/dev/null | sort
          echo "--- Linux ---";   find webp-natives-linux/src/main/resources/native   -type f 2>/dev/null | sort
          echo "--- macOS ---";   find webp-natives-macos/src/main/resources/native   -type f 2>/dev/null | sort

      - name: publishToMavenLocal (all modules)
        run: |
          ./gradlew :webp-natives-core:publishToMavenLocal \
                    :webp-natives-windows:publishToMavenLocal \
                    :webp-natives-linux:publishToMavenLocal \
                    :webp-natives-macos:publishToMavenLocal \
                    :webp-natives-all:publishToMavenLocal \
                    --no-daemon

      - name: Stage maven-repo output
        run: |
          mkdir -p maven-repo/gg/norisk/webp
          cp -R ~/.m2/repository/gg/norisk/webp/* maven-repo/gg/norisk/webp/
          echo "=== Published artifacts ==="
          find maven-repo -type f \( -name "*.jar" -o -name "*.pom" -o -name "maven-metadata.xml" \) | sort

      - name: Generate index.html
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          cat > maven-repo/index.html <<HTML
          <!doctype html>
          <html><head><meta charset="utf-8"><title>webp-natives - Maven Repository</title>
          <style>
            body{font-family:system-ui,sans-serif;max-width:780px;margin:2rem auto;padding:0 1rem;line-height:1.5;color:#222}
            h1{margin-top:0}
            h2{margin-top:2rem}
            pre{background:#f4f4f4;padding:1rem;border-radius:6px;overflow-x:auto}
            code{background:#f4f4f4;padding:2px 6px;border-radius:3px}
            a{color:#0366d6}
          </style></head><body>
          <h1>webp-natives</h1>
          <p>Public Maven repository for
            <a href="https://github.com/${OWNER}/${REPO}">${OWNER}/${REPO}</a>.
            No auth required. Backed by Google libwebp via JNI.</p>

          <h2>Aggregator (recommended — one dep, all platforms)</h2>
          <pre>repositories {
              maven("https://${OWNER}.github.io/${REPO}/")
          }
          dependencies {
              implementation("gg.norisk.webp:all:&lt;VERSION&gt;")
          }</pre>
          <p>Pulls in core + windows (DLLs x64/arm64) + linux (.so x64/aarch64) +
             macos (universal dylib). At runtime, gg.norisk.webp.WebP picks the
             matching native from the classpath via NativeLoader.</p>

          <h2>Individual modules</h2>
          <pre>implementation("gg.norisk.webp:core:&lt;VERSION&gt;")
          implementation("gg.norisk.webp:windows:&lt;VERSION&gt;")
          implementation("gg.norisk.webp:linux:&lt;VERSION&gt;")
          implementation("gg.norisk.webp:macos:&lt;VERSION&gt;")</pre>

          <h2>Versioning</h2>
          <p>Branch push: <code>YY.Q.BUILD-branch</code> (e.g. <code>26.2.5-main</code>).<br>
             Tag push: <code>v1.0.0</code> &rarr; <code>1.0.0</code>.</p>

          <p><a href="gg/norisk/webp/">Browse artifacts &rarr;</a></p>
          </body></html>
          HTML

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: maven-repo
          publish_branch: gh-pages
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Publish ${{ github.sha }}"
